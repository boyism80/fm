syntax = "proto3";


package fm.internal;

option go_package = "github.com/boyism80/fm/protocol/protobuf/gengo/fminternal;fminternalpb";

service Internal {
  rpc Ping (PingRequest) returns (PingReply);
  rpc GetGameChannelStatus (GetGameChannelStatusRequest) returns (GetGameChannelStatusReply);
  rpc GetServerCatalog (GetServerCatalogRequest) returns (GetServerCatalogReply);
  rpc EnterGame (EnterGameRequest) returns (EnterGameReply);
  rpc BeginGameTransition (BeginGameTransitionRequest) returns (BeginGameTransitionReply);
  rpc SaveCharacter (SaveCharacterRequest) returns (SaveCharacterReply);
  rpc SaveCharacters (SaveCharactersRequest) returns (SaveCharactersReply);
  rpc LoginAccount (LoginAccountRequest) returns (LoginAccountReply);
  rpc GetCharacterList (GetCharacterListRequest) returns (GetCharacterListReply);
  rpc CheckCharacterName (CheckCharacterNameRequest) returns (CheckCharacterNameReply);
  rpc CreateCharacter (CreateCharacterRequest) returns (CreateCharacterReply);
  rpc DeleteCharacter (DeleteCharacterRequest) returns (DeleteCharacterReply);
  rpc RefreshSession (RefreshSessionRequest) returns (RefreshSessionReply);
  rpc LogoutSession (LogoutSessionRequest) returns (LogoutSessionReply);
  rpc CreateParty (CreatePartyRequest) returns (CreatePartyReply);
  rpc JoinParty (JoinPartyRequest) returns (JoinPartyReply);
  rpc LeaveParty (LeavePartyRequest) returns (LeavePartyReply);
  rpc ExpelParty (ExpelPartyRequest) returns (ExpelPartyReply);
  rpc ChangePartyLeader (ChangePartyLeaderRequest) returns (ChangePartyLeaderReply);
  rpc GetParty (GetPartyRequest) returns (GetPartyReply);
  rpc UpdatePartyMember (UpdatePartyMemberRequest) returns (UpdatePartyMemberReply);
  rpc InviteParty (InvitePartyRequest) returns (InvitePartyReply);
  rpc DenyParty (DenyPartyRequest) returns (DenyPartyReply);
  rpc CreateGuild (CreateGuildRequest) returns (CreateGuildReply);
  rpc GetGuild (GetGuildRequest) returns (GetGuildReply);
  rpc CreateAlliance (CreateAllianceRequest) returns (CreateAllianceReply);
  rpc GetAlliance (GetAllianceRequest) returns (GetAllianceReply);
  rpc AcceptGuildInvite (AcceptGuildInviteRequest) returns (AcceptGuildInviteReply);
  rpc LeaveGuild (LeaveGuildRequest) returns (LeaveGuildReply);
  rpc ExpelGuild (ExpelGuildRequest) returns (ExpelGuildReply);
  rpc ChangeGuildRankTitles (ChangeGuildRankTitlesRequest) returns (ChangeGuildRankTitlesReply);
  rpc ChangeGuildMemberRank (ChangeGuildMemberRankRequest) returns (ChangeGuildMemberRankReply);
  rpc ChangeGuildEmblem (ChangeGuildEmblemRequest) returns (ChangeGuildEmblemReply);
  rpc ChangeGuildNotice (ChangeGuildNoticeRequest) returns (ChangeGuildNoticeReply);
  rpc IncreaseGuildCapacity (IncreaseGuildCapacityRequest) returns (IncreaseGuildCapacityReply);
  rpc ListGuildBulletinBoardThreads (ListGuildBulletinBoardThreadsRequest) returns (ListGuildBulletinBoardThreadsReply);
  rpc ShowGuildBulletinBoardThread (ShowGuildBulletinBoardThreadRequest) returns (ShowGuildBulletinBoardThreadReply);
  rpc CreateGuildBulletinBoardThread (CreateGuildBulletinBoardThreadRequest) returns (CreateGuildBulletinBoardThreadReply);
  rpc UpdateGuildBulletinBoardThread (UpdateGuildBulletinBoardThreadRequest) returns (UpdateGuildBulletinBoardThreadReply);
  rpc DeleteGuildBulletinBoardThread (DeleteGuildBulletinBoardThreadRequest) returns (DeleteGuildBulletinBoardThreadReply);
  rpc CreateGuildBulletinBoardReply (CreateGuildBulletinBoardReplyRequest) returns (CreateGuildBulletinBoardReplyReply);
  rpc DeleteGuildBulletinBoardReply (DeleteGuildBulletinBoardReplyRequest) returns (DeleteGuildBulletinBoardReplyReply);
  rpc DisbandGuild (DisbandGuildRequest) returns (DisbandGuildReply);
  rpc RequestBuddy (RequestBuddyRequest) returns (RequestBuddyReply);
  rpc AcceptBuddy (AcceptBuddyRequest) returns (AcceptBuddyReply);
  rpc RemoveBuddy (RemoveBuddyRequest) returns (RemoveBuddyReply);
  rpc BroadcastMultiChat (BroadcastMultiChatRequest) returns (BroadcastMultiChatReply);
}

enum ServerRole {
  SERVER_ROLE_UNSPECIFIED = 0;
  SERVER_ROLE_LOGIN = 1;
  SERVER_ROLE_GAME = 2;
}

message PingRequest {
  ServerRole role = 1;
  uint32 world_id = 2;
  uint32 channel_id = 3;
  string login_instance_id = 4;
}

message PingReply {
  string message = 1;
}

message GetGameChannelStatusRequest {
  uint32 world_id = 1;
  uint32 channel_id = 2;
}

message GetGameChannelStatusReply {
  bool alive = 1;
  bool channel_full = 2;
  bool found = 3;
  string host = 4;
  uint32 port = 5;
}

message GetServerCatalogRequest {}

message ChannelCatalog {
  uint32 channel_id = 1;
  string host = 2;
  uint32 port = 3;
  string name = 4;
}

message WorldCatalog {
  uint32 world_id = 1;
  string world_name = 2;
  uint32 flag = 3;
  string event_message = 4;
  repeated ChannelCatalog channels = 5;
}

message GetServerCatalogReply {
  repeated WorldCatalog worlds = 1;
}

message EnterGameRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
  uint32 channel_id = 3;
}

message CharacterPersisted {
  uint32 character_id      = 1;
  uint32 world_id          = 2;
  string name              = 3;
  uint32 gender            = 4;
  uint32 skin_color        = 5;
  uint32 face              = 6;
  uint32 hair              = 7;
  uint32 level             = 8;
  uint32 class_id          = 9;
  uint32 str               = 10;
  uint32 dex               = 11;
  uint32 int_stat          = 12;
  uint32 luk               = 13;
  uint32 hp                = 14;
  uint32 max_hp            = 15;
  uint32 mp                = 16;
  uint32 max_mp            = 17;
  uint32 ability_point     = 18;
  uint32 exp               = 19;
  uint32 map_id            = 20;
  uint32 spawn_point       = 21;
  int32  position_x        = 22;
  int32  position_y        = 23;
  uint32 stance            = 24;
  int32  meso              = 25;
  uint32 skill_point       = 26;
  uint32 account_id        = 27;
  uint32 role              = 28;
  bool   hidden            = 29;
}

message KeyLayoutBinding {
  int32  slot  = 1;
  uint32 type  = 2;
  int32  action = 3;
}

message EnterGameReply {
  bool                        found     = 1;
  CharacterPersisted          character = 2;
  repeated InventoryPersisted inventory = 3;
  repeated SkillPersisted     skills    = 4;
  repeated KeyLayoutBinding   key_layout = 5;
  optional uint32              party_id  = 6;
  uint32                       guild_id  = 7;
  repeated BuffPersisted      buffs     = 8;
  repeated BuddyEntry         buddies   = 9;
  uint32                       buddy_capacity = 10;
}

message BeginGameTransitionRequest {
  uint32 world_id = 1;
  uint32 account_id = 2;
  uint32 character_id = 3;
}

enum SessionErrorCode {
  SESSION_NONE = 0;
  SESSION_UNKNOWN = 1;
  SESSION_ALREADY_LOGGED_IN = 2;
  SESSION_NOT_FOUND = 3;
  SESSION_LOGOUT_FAILED = 4;
}

message BeginGameTransitionReply {
  bool ok = 1;
  SessionErrorCode error_code = 2;
}

message SaveCharacterRequest {
  CharacterPersisted     character  = 1;
  map<int32, uint32>     base_looks = 2;
  map<int32, uint32>     overlays   = 3;
}

message SaveCharacterReply {
  bool ok = 1;
}

message CharacterSaveEntry {
  CharacterPersisted     character  = 1;
  map<int32, uint32>     base_looks = 2;
  map<int32, uint32>     overlays   = 3;
  repeated InventoryPersisted inventory = 4;
  repeated SkillPersisted     skills    = 5;
  repeated KeyLayoutBinding   key_layout = 6;
  repeated BuffPersisted      buffs     = 7;
}

message SaveCharactersRequest {
  repeated CharacterSaveEntry entries = 1;
}

message SaveCharactersReply {
  bool ok = 1;
}

message EquipmentBonusStatsPersisted {
  int32 str    = 1;
  int32 dex    = 2;
  int32 int_stat = 3;
  int32 luk    = 4;
  int32 max_hp = 5;
  int32 max_mp = 6;
  int32 pad    = 7;
  int32 mad    = 8;
  int32 pdd    = 9;
  int32 mdd    = 10;
  int32 acc    = 11;
  int32 avoid  = 12;
  int32 hands  = 13;
  int32 speed  = 14;
  int32 jump   = 15;
}

message InventoryPersisted {
  optional uint64 unique_id = 1;
  uint32 owner_id           = 2;
  uint32 item_id            = 3;
  int32  slot               = 4;
  uint32 count              = 5;
  int64  expiration_unix_ms = 6;
  uint32 enhance_chance     = 7;
  uint32 flag               = 8;
  uint32 skill_bonus        = 9;
  string owner_name         = 10;
  uint32 inventory_type     = 11;
  optional EquipmentBonusStatsPersisted equip_bonus_stats = 12;
  uint32 enhance_count      = 13;
}

message SkillPersisted {
  uint32 character_id         = 1;
  uint32 skill_id             = 2;
  int32  level                = 3;
  int32  master_level         = 4;
  int64  cooldown_end_unix_ms = 5;
}

enum BuffKind {
  BUFF_KIND_SKILL = 0;
  BUFF_KIND_ITEM  = 1;
}

message BuffFlagValuePersisted {
  uint32 mask     = 1;
  int32  position = 2;
  int32  value    = 3;
}

message BuffPersisted {
  uint32 character_id                 = 1;
  int32  buff_source_id               = 2;
  BuffKind kind                       = 3;
  repeated BuffFlagValuePersisted flag_values = 4;
  optional uint64 remaining_duration_ms = 5;
  uint32 skill_level                  = 6;
  uint32 causer_id                    = 7;
}

message LoginAccountRequest {
  string login_id    = 1;
  string password    = 2;
  string mac_address = 3;
  string ip_address  = 4;
  uint32 initial_role = 5;
}

message LoginAccountReply {
  enum Status {
    SUCCESS        = 0;
    WRONG_PASSWORD = 1;
    BANNED         = 2;
    REGISTERED     = 3;
    ALREADY_LOGGED_IN = 4;
  }
  Status  status                     = 1;
  uint32  account_id                 = 2;
  uint32  gender                     = 3;
  bool    is_chat_blocked            = 4;
  int64   chat_blocked_until_unix_ms = 5;
  uint32  character_slot_count       = 6;
  uint32  role                       = 7;
}

message CharacterOverview {
  uint32             character_id    = 1;
  string             name            = 2;
  uint32             gender          = 3;
  uint32             skin_color      = 4;
  uint32             face            = 5;
  uint32             hair            = 6;
  uint32             level           = 7;
  uint32             class_id        = 8;
  uint32             map_id          = 9;
  uint32             spawn_point     = 10;
  uint32             account_id      = 11;
  uint32             world_id        = 12;
  int32              rank            = 13;
  int32              rank_diff       = 14;
  int32              class_rank      = 15;
  int32              class_rank_diff = 16;
  map<int32, uint32> base_looks      = 17;
  map<int32, uint32> overlays        = 18;
}

message GetCharacterListRequest {
  uint32 account_id = 1;
  uint32 world_id   = 2;
}

message GetCharacterListReply {
  repeated CharacterOverview characters = 1;
  uint32                     slot_count = 2;
}

message CheckCharacterNameRequest {
  string name = 1;
}

message CheckCharacterNameReply {
  bool exists = 1;
}

message CreateCharacterRequest {
  uint32 account_id     = 1;
  uint32 world_id       = 2;
  string name           = 3;
  uint32 face           = 4;
  uint32 hair           = 5;
  uint32 skin_color     = 6;
  uint32 top_item_id    = 7;
  uint32 bottom_item_id = 8;
  uint32 shoes_item_id  = 9;
  uint32 weapon_item_id = 10;
}

message CreateCharacterReply {
  bool              success   = 1;
  string            error_msg = 2;
  CharacterOverview character = 3;
}

message DeleteCharacterRequest {
  uint32 account_id   = 1;
  uint32 character_id = 2;
}

message DeleteCharacterReply {
  bool success = 1;
}

message RefreshSessionRequest {
  uint32 world_id = 1;
  uint32 account_id = 2;
  optional uint32 character_id = 3;
}

message RefreshSessionReply {
  bool ok = 1;
  SessionErrorCode error_code = 2;
}

enum AccountSessionState {
  ACCOUNT_SESSION_STATE_UNSPECIFIED = 0;
  ACCOUNT_SESSION_STATE_LOGIN = 1;
  ACCOUNT_SESSION_STATE_TRANSITION = 2;
  ACCOUNT_SESSION_STATE_GAME = 3;
}

enum CharacterSessionState {
  CHARACTER_SESSION_STATE_UNSPECIFIED = 0;
  CHARACTER_SESSION_STATE_TRANSITION = 1;
  CHARACTER_SESSION_STATE_ONLINE = 2;
}

enum SessionDisconnectSource {
  SESSION_DISCONNECT_SOURCE_UNSPECIFIED = 0;
  SESSION_DISCONNECT_SOURCE_LOGIN_SERVER = 1;
  SESSION_DISCONNECT_SOURCE_GAME_SERVER = 2;
}

message LogoutSessionRequest {
  uint32 world_id = 1;
  uint32 account_id = 2;
  SessionDisconnectSource disconnect_source = 3;
  bool transfer_disconnect = 4;
  optional uint32 character_id = 5;
  optional uint32 channel_id = 6;
}

message LogoutSessionReply {
  bool ok = 1;
}

message PartyDoor {
  uint32 town = 1;
  uint32 target = 2;
  int32 x = 3;
  int32 y = 4;
}

enum PartyMemberRole {
  PARTY_MEMBER_ROLE_UNSPECIFIED = 0;
  PARTY_MEMBER_ROLE_MEMBER = 1;
  PARTY_MEMBER_ROLE_LEADER = 2;
}

message PartyMember {
  uint32 world_id = 1;
  uint32 character_id = 2;
  string character_name = 3;
  uint32 level = 4;
  uint32 class_id = 5;
  PartyMemberRole role = 6;
  uint32 map_id = 7;
  optional int32 channel_index = 8;
  optional PartyDoor door = 9;
}

message CreatePartyRequest {
  uint32 world_id = 1;
  PartyMember leader = 2;
}

enum PartyErrorCode {
  NONE = 0;
  UNKNOWN = 1;
  ALREADY_IN_PARTY = 2;
  CHARACTER_NOT_FOUND = 3;
  PARTY_NOT_FOUND = 4;
  PARTY_FULL = 5;
  NOT_IN_PARTY = 6;
  NOT_PARTY_LEADER = 7;
  TARGET_NOT_IN_PARTY = 8;
  TARGET_ALREADY_LEADER = 9;
  CANNOT_EXPEL_SELF = 10;
  INVITE_EXPIRED_OR_INVALID = 11;
  TARGET_OFFLINE = 12;
  INVITER_NOT_IN_PARTY = 13;
  CANNOT_INVITE_SELF = 14;
  TARGET_ALREADY_IN_PARTY = 15;
}

message CreatePartyReply {
  bool ok = 1;
  PartyErrorCode error_code = 2;
  optional uint32 party_id = 3;
  uint64 revision = 4;
}

message JoinPartyRequest {
  uint32 world_id = 1;
  uint32 party_id = 2;
  PartyMember member = 3;
  bool skip_invite_pending_check = 4;
}

message JoinPartyReply {
  bool ok = 1;
  PartyErrorCode error_code = 2;
  optional uint32 party_id = 3;
  uint64 revision = 4;
}

message LeavePartyRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
}

message LeavePartyReply {
  bool ok = 1;
  PartyErrorCode error_code = 2;
  optional uint32 party_id = 3;
  uint64 revision = 4;
  bool disbanded = 5;
}

message ExpelPartyRequest {
  uint32 world_id = 1;
  uint32 requester_character_id = 2;
  uint32 target_character_id = 3;
}

message ExpelPartyReply {
  bool ok = 1;
  PartyErrorCode error_code = 2;
  optional uint32 party_id = 3;
  uint64 revision = 4;
  bool disbanded = 5;
}

message ChangePartyLeaderRequest {
  uint32 world_id = 1;
  uint32 party_id = 2;
  uint32 requester_character_id = 3;
  uint32 new_leader_character_id = 4;
}

message ChangePartyLeaderReply {
  bool ok = 1;
  PartyErrorCode error_code = 2;
  optional uint32 party_id = 3;
  uint64 revision = 4;
}

enum PartyState {
  PARTY_STATE_UNSPECIFIED = 0;
  PARTY_STATE_ACTIVE = 1;
}

message Party {
  uint32 world_id = 1;
  uint32 party_id = 2;
  uint32 leader_character_id = 3;
  uint64 revision = 4;
  PartyState state = 5;
  repeated PartyMember members = 6;
}

message GetPartyRequest {
  uint32 world_id = 1;
  uint32 party_id = 2;
}

message GetPartyReply {
  bool found = 1;
  Party party = 2;
}

message UpdatePartyMemberRequest {
  PartyMember member = 1;
}

message UpdatePartyMemberReply {
  bool ok = 1;
  PartyErrorCode error_code = 2;
  optional uint32 party_id = 3;
  uint64 revision = 4;
}

message InvitePartyRequest {
  uint32 world_id = 1;
  uint32 inviter_character_id = 2;
  string target_character_name = 3;
}

message InvitePartyReply {
  bool ok = 1;
  PartyErrorCode error_code = 2;
  uint32 target_character_id = 3;
  uint32 target_channel_id = 4;
  optional uint32 party_id = 5;
}

message DenyPartyRequest {
  uint32 world_id = 1;
  uint32 denied_character_id = 2;
  string inviter_name = 3;
  uint32 action = 4;
}

message DenyPartyReply {
  bool ok = 1;
  PartyErrorCode error_code = 2;
}

enum GuildMemberRank {
  GUILD_MEMBER_RANK_UNSPECIFIED = 0;
  GUILD_MEMBER_RANK_MASTER = 1;
  GUILD_MEMBER_RANK_JUNIOR = 2;
  GUILD_MEMBER_RANK_SENIOR = 3;
  GUILD_MEMBER_RANK_MEMBER = 4;
  GUILD_MEMBER_RANK_NEW = 5;
}

message GuildMember {
  uint32 world_id = 1;
  uint32 character_id = 2;
  string character_name = 3;
  uint32 level = 4;
  uint32 class_id = 5;
  GuildMemberRank rank = 6;
  optional int32 channel_index = 7;
  optional uint32 alliance_rank = 8;
}

message CreateGuildRequest {
  uint32 world_id = 1;
  string guild_name = 2;
  GuildMember leader = 3;
}

enum GuildErrorCode {
  GUILD_ERROR_NONE = 0;
  GUILD_ERROR_UNKNOWN = 1;
  GUILD_ERROR_ALREADY_IN_GUILD = 2;
  GUILD_ERROR_CHARACTER_NOT_FOUND = 3;
  GUILD_ERROR_GUILD_NAME_INVALID = 4;
  GUILD_ERROR_GUILD_NAME_TAKEN = 5;
  GUILD_ERROR_LEADER_MISMATCH = 6;
  GUILD_ERROR_GUILD_NOT_FOUND = 7;
  GUILD_ERROR_GUILD_FULL = 8;
  GUILD_ERROR_NOT_IN_GUILD = 9;
  GUILD_ERROR_LEADER_CANNOT_LEAVE = 10;
  GUILD_ERROR_NOT_AUTHORIZED = 11;
  GUILD_ERROR_CANNOT_EXPEL_TARGET = 12;
  GUILD_ERROR_TARGET_NOT_IN_GUILD = 13;
  GUILD_ERROR_INVALID_RANK_TITLES = 14;
  GUILD_ERROR_INVALID_MEMBER_RANK = 15;
  GUILD_ERROR_INVALID_NOTICE = 16;
  GUILD_ERROR_INVALID_BULLETIN_CONTENT = 17;
  GUILD_ERROR_BULLETIN_THREAD_NOT_FOUND = 18;
  GUILD_ERROR_BULLETIN_REPLY_NOT_FOUND = 19;
  GUILD_ERROR_BULLETIN_COOLDOWN = 20;
  GUILD_ERROR_CAPACITY_REACHED = 21;
  GUILD_ERROR_INSUFFICIENT_GUILD_GP = 22;
}

message GuildBulletinBoardThreadEntry {
  int32 local_thread_id = 1;
  uint32 poster_character_id = 2;
  string title = 3;
  int64 timestamp_unix_ms = 4;
  int32 icon = 5;
  int32 reply_count = 6;
}

message GuildBulletinBoardReplyEntry {
  int32 reply_id = 1;
  uint32 poster_character_id = 2;
  int64 timestamp_unix_ms = 3;
  string content = 4;
}

message GuildBulletinBoardThreadDetail {
  int32 local_thread_id = 1;
  uint32 poster_character_id = 2;
  int64 timestamp_unix_ms = 3;
  string title = 4;
  string body = 5;
  int32 icon = 6;
  repeated GuildBulletinBoardReplyEntry replies = 7;
}

message ListGuildBulletinBoardThreadsRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
  int32 page = 3;
}

message ListGuildBulletinBoardThreadsReply {
  bool ok = 1;
  GuildErrorCode error_code = 2;
  repeated GuildBulletinBoardThreadEntry threads = 3;
  int32 list_start = 4;
  int32 thread_count = 5;
  GuildBulletinBoardThreadEntry notice = 6;
}

message ShowGuildBulletinBoardThreadRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
  int32 local_thread_id = 3;
}

message ShowGuildBulletinBoardThreadReply {
  bool ok = 1;
  GuildErrorCode error_code = 2;
  GuildBulletinBoardThreadDetail thread = 3;
}

message CreateGuildBulletinBoardThreadRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
  bool notice = 3;
  string title = 4;
  string body = 5;
  int32 icon = 6;
}

message CreateGuildBulletinBoardThreadReply {
  bool ok = 1;
  GuildErrorCode error_code = 2;
  GuildBulletinBoardThreadDetail thread = 3;
  repeated GuildBulletinBoardThreadEntry threads = 4;
  int32 list_start = 5;
  int32 thread_count = 6;
  GuildBulletinBoardThreadEntry notice = 7;
}

message UpdateGuildBulletinBoardThreadRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
  int32 local_thread_id = 3;
  string title = 4;
  string body = 5;
  int32 icon = 6;
}

message UpdateGuildBulletinBoardThreadReply {
  bool ok = 1;
  GuildErrorCode error_code = 2;
  GuildBulletinBoardThreadDetail thread = 3;
}

message DeleteGuildBulletinBoardThreadRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
  int32 local_thread_id = 3;
}

message DeleteGuildBulletinBoardThreadReply {
  bool ok = 1;
  GuildErrorCode error_code = 2;
}

message CreateGuildBulletinBoardReplyRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
  int32 local_thread_id = 3;
  string content = 4;
}

message CreateGuildBulletinBoardReplyReply {
  bool ok = 1;
  GuildErrorCode error_code = 2;
  GuildBulletinBoardThreadDetail thread = 3;
}

message DeleteGuildBulletinBoardReplyRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
  int32 local_thread_id = 3;
  int32 reply_id = 4;
}

message DeleteGuildBulletinBoardReplyReply {
  bool ok = 1;
  GuildErrorCode error_code = 2;
  GuildBulletinBoardThreadDetail thread = 3;
}

message CreateGuildReply {
  bool ok = 1;
  GuildErrorCode error_code = 2;
  optional uint32 guild_id = 3;
  uint64 revision = 4;
  optional Guild guild = 5;
}

message AcceptGuildInviteRequest {
  uint32 world_id = 1;
  uint32 guild_id = 2;
  GuildMember member = 3;
}

message AcceptGuildInviteReply {
  bool ok = 1;
  GuildErrorCode error_code = 2;
  optional Guild guild = 3;
}

message LeaveGuildRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
}

message LeaveGuildReply {
  bool ok = 1;
  GuildErrorCode error_code = 2;
  optional uint32 guild_id = 3;
  uint64 revision = 4;
}

message ExpelGuildRequest {
  uint32 world_id = 1;
  uint32 requester_character_id = 2;
  uint32 target_character_id = 3;
}

message ExpelGuildReply {
  bool ok = 1;
  GuildErrorCode error_code = 2;
  optional uint32 guild_id = 3;
  uint64 revision = 4;
}

message ChangeGuildRankTitlesRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
  repeated string rank_titles = 3;
}

message ChangeGuildRankTitlesReply {
  bool ok = 1;
  GuildErrorCode error_code = 2;
  optional uint32 guild_id = 3;
  uint64 revision = 4;
}

message ChangeGuildMemberRankRequest {
  uint32 world_id = 1;
  uint32 requester_character_id = 2;
  uint32 target_character_id = 3;
  GuildMemberRank new_rank = 4;
}

message ChangeGuildMemberRankReply {
  bool ok = 1;
  GuildErrorCode error_code = 2;
  optional uint32 guild_id = 3;
  uint64 revision = 4;
}

message ChangeGuildEmblemRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
  GuildLogo logo = 3;
}

message ChangeGuildEmblemReply {
  bool ok = 1;
  GuildErrorCode error_code = 2;
  optional uint32 guild_id = 3;
  uint64 revision = 4;
}

message ChangeGuildNoticeRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
  string notice = 3;
}

message ChangeGuildNoticeReply {
  bool ok = 1;
  GuildErrorCode error_code = 2;
  optional uint32 guild_id = 3;
  uint64 revision = 4;
}

message IncreaseGuildCapacityRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
  bool extended_cap = 3;
}

message IncreaseGuildCapacityReply {
  bool ok = 1;
  GuildErrorCode error_code = 2;
  optional uint32 guild_id = 3;
  uint64 revision = 4;
  uint32 capacity = 5;
  uint32 gp = 6;
}

message DisbandGuildRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
}

message DisbandGuildReply {
  bool ok = 1;
  GuildErrorCode error_code = 2;
  optional uint32 guild_id = 3;
  uint64 revision = 4;
}

message GuildLogo {
  uint32 logo = 1;
  uint32 logo_color = 2;
  uint32 logo_bg = 3;
  uint32 logo_bg_color = 4;
}

message Guild {
  uint32 world_id = 1;
  uint32 guild_id = 2;
  string name = 3;
  uint32 leader_character_id = 4;
  uint64 revision = 5;
  uint32 gp = 6;
  uint32 capacity = 7;
  string notice = 8;
  GuildLogo logo = 9;
  repeated string rank_titles = 10;
  repeated GuildMember members = 11;
  optional uint32 alliance_id = 12;
}

enum AllianceErrorCode {
  ALLIANCE_ERROR_NONE = 0;
  ALLIANCE_ERROR_UNKNOWN = 1;
  ALLIANCE_ERROR_ALREADY_IN_ALLIANCE = 2;
  ALLIANCE_ERROR_GUILD_NOT_FOUND = 3;
  ALLIANCE_ERROR_NOT_GUILD_MASTER = 4;
  ALLIANCE_ERROR_ALLIANCE_NAME_INVALID = 5;
  ALLIANCE_ERROR_ALLIANCE_NAME_TAKEN = 6;
  ALLIANCE_ERROR_PARTNER_INVALID = 7;
  ALLIANCE_ERROR_GUILD_ALREADY_IN_ALLIANCE = 8;
}

message Alliance {
  uint32 world_id = 1;
  uint32 alliance_id = 2;
  string name = 3;
  uint32 leader_character_id = 4;
  uint64 revision = 5;
  uint32 capacity = 6;
  string notice = 7;
  repeated string rank_titles = 8;
  repeated uint32 guild_ids = 9;
  repeated Guild guilds = 10;
}

message CreateAllianceRequest {
  uint32 world_id = 1;
  string alliance_name = 2;
  uint32 leader_character_id = 3;
  uint32 partner_character_id = 4;
}

message CreateAllianceReply {
  bool ok = 1;
  AllianceErrorCode error_code = 2;
  uint32 alliance_id = 3;
  uint64 revision = 4;
  Alliance alliance = 5;
}

message GetAllianceRequest {
  uint32 world_id = 1;
  uint32 alliance_id = 2;
}

message GetAllianceReply {
  bool found = 1;
  Alliance alliance = 2;
}

message GetGuildRequest {
  uint32 world_id = 1;
  uint32 guild_id = 2;
}

message GetGuildReply {
  bool found = 1;
  Guild guild = 2;
}

message BroadcastMultiChatRequest {
  uint32 world_id = 1;
  uint32 member_id = 2;
  uint32 sender_character_id = 3;
  uint32 chat_mode = 4;
  string sender_name = 5;
  string message = 6;
  repeated uint32 recipient_character_ids = 7;
}

message BroadcastMultiChatReply {
  bool ok = 1;
  PartyErrorCode error_code = 2;
  uint32 delivered_count = 3;
}

enum BuddyErrorCode {
  BUDDY_ERROR_NONE = 0;
  BUDDY_ERROR_UNKNOWN = 1;
  BUDDY_ERROR_CHARACTER_NOT_FOUND = 2;
  BUDDY_ERROR_LIST_FULL = 3;
  BUDDY_ERROR_TARGET_LIST_FULL = 4;
  BUDDY_ERROR_ALREADY_ON_LIST = 5;
  BUDDY_ERROR_NOT_PENDING = 6;
  BUDDY_ERROR_CANNOT_ADD_SELF = 7;
  BUDDY_ERROR_TARGET_IS_HIDDEN_GM = 8;
}

message BuddyEntry {
  uint32 character_id = 1;
  string name = 2;
  string group_name = 3;
  bool pending = 4;
  int32 channel_index = 5;
}

message RequestBuddyRequest {
  uint32 world_id = 1;
  uint32 requester_character_id = 2;
  string target_character_name = 3;
  string group_name = 4;
}

message RequestBuddyReply {
  bool ok = 1;
  BuddyErrorCode error_code = 2;
  uint32 target_character_id = 3;
  uint32 target_channel_id = 4;
  BuddyEntry requester_view = 5;
}

message AcceptBuddyRequest {
  uint32 world_id = 1;
  uint32 accepter_character_id = 2;
  uint32 requester_character_id = 3;
}

message AcceptBuddyReply {
  bool ok = 1;
  BuddyErrorCode error_code = 2;
  uint32 requester_character_id = 3;
  uint32 requester_channel_id = 4;
  BuddyEntry accepter_view = 5;
  BuddyEntry requester_view = 6;
}

message RemoveBuddyRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
  uint32 buddy_character_id = 3;
}

message RemoveBuddyReply {
  bool ok = 1;
  BuddyErrorCode error_code = 2;
  uint32 buddy_character_id = 3;
  uint32 buddy_channel_id = 4;
  bool buddy_was_accepted = 5;
  bool removed_from_owner = 6;
}
