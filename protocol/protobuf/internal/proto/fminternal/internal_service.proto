syntax = "proto3";


package fm.internal;

option go_package = "github.com/boyism80/fm/protocol/protobuf/gengo/fminternal;fminternalpb";

service Internal {
  rpc Ping (PingRequest) returns (PingReply);
  rpc GetGameChannelStatus (GetGameChannelStatusRequest) returns (GetGameChannelStatusReply);
  rpc GetServerCatalog (GetServerCatalogRequest) returns (GetServerCatalogReply);
  rpc EnterGame (EnterGameRequest) returns (EnterGameReply);
  rpc BeginGameTransition (BeginGameTransitionRequest) returns (BeginGameTransitionReply);
  rpc SaveCharacter (SaveCharacterRequest) returns (SaveCharacterReply);
  rpc SaveCharacters (SaveCharactersRequest) returns (SaveCharactersReply);
  rpc LoadStorage (LoadStorageRequest) returns (LoadStorageReply);
  rpc LoadParcels (LoadParcelsRequest) returns (LoadParcelsReply);
  rpc SendParcel (SendParcelRequest) returns (SendParcelReply);
  rpc ClaimParcel (ClaimParcelRequest) returns (ClaimParcelReply);
  rpc DeleteParcel (DeleteParcelRequest) returns (DeleteParcelReply);
  rpc CheckParcelArrivals (CheckParcelArrivalsRequest) returns (CheckParcelArrivalsReply);
  rpc FindEntrustedShop (FindEntrustedShopRequest) returns (FindEntrustedShopReply);
  rpc OpenShop (OpenShopRequest) returns (OpenShopReply);
  rpc SaveShop (SaveShopRequest) returns (SaveShopReply);
  rpc ClaimStoreBank (ClaimStoreBankRequest) returns (ClaimStoreBankReply);
  rpc CloseChannelShops (CloseChannelShopsRequest) returns (CloseChannelShopsReply);
  rpc SearchShops (SearchShopsRequest) returns (SearchShopsReply);
  rpc FindPopularShopSearches (FindPopularShopSearchesRequest) returns (FindPopularShopSearchesReply);
  rpc LoginAccount (LoginAccountRequest) returns (LoginAccountReply);
  rpc SetAccountRole (SetAccountRoleRequest) returns (SetAccountRoleReply);
  rpc GetCharacterList (GetCharacterListRequest) returns (GetCharacterListReply);
  rpc CheckCharacterName (CheckCharacterNameRequest) returns (CheckCharacterNameReply);
  rpc CreateCharacter (CreateCharacterRequest) returns (CreateCharacterReply);
  rpc DeleteCharacter (DeleteCharacterRequest) returns (DeleteCharacterReply);
  rpc RefreshSession (RefreshSessionRequest) returns (RefreshSessionReply);
  rpc LogoutSession (LogoutSessionRequest) returns (LogoutSessionReply);
  rpc CreateParty (CreatePartyRequest) returns (CreatePartyReply);
  rpc JoinParty (JoinPartyRequest) returns (JoinPartyReply);
  rpc LeaveParty (LeavePartyRequest) returns (LeavePartyReply);
  rpc ExpelParty (ExpelPartyRequest) returns (ExpelPartyReply);
  rpc ChangePartyLeader (ChangePartyLeaderRequest) returns (ChangePartyLeaderReply);
  rpc GetParty (GetPartyRequest) returns (GetPartyReply);
  rpc UpdatePartyMember (UpdatePartyMemberRequest) returns (UpdatePartyMemberReply);
  rpc InviteParty (InvitePartyRequest) returns (InvitePartyReply);
  rpc DenyParty (DenyPartyRequest) returns (DenyPartyReply);
  rpc CreateGuild (CreateGuildRequest) returns (CreateGuildReply);
  rpc GetGuild (GetGuildRequest) returns (GetGuildReply);
  rpc CreateAlliance (CreateAllianceRequest) returns (CreateAllianceReply);
  rpc GetAlliance (GetAllianceRequest) returns (GetAllianceReply);
  rpc DisbandAlliance (DisbandAllianceRequest) returns (DisbandAllianceReply);
  rpc LeaveAlliance (LeaveAllianceRequest) returns (LeaveAllianceReply);
  rpc ExpelAllianceGuild (ExpelAllianceGuildRequest) returns (ExpelAllianceGuildReply);
  rpc AcceptAllianceInvite (AcceptAllianceInviteRequest) returns (AcceptAllianceInviteReply);
  rpc IncreaseAllianceCapacity (IncreaseAllianceCapacityRequest) returns (IncreaseAllianceCapacityReply);
  rpc ChangeAllianceRankTitles (ChangeAllianceRankTitlesRequest) returns (ChangeAllianceRankTitlesReply);
  rpc ChangeAllianceMemberRank (ChangeAllianceMemberRankRequest) returns (ChangeAllianceMemberRankReply);
  rpc ChangeAllianceLeader (ChangeAllianceLeaderRequest) returns (ChangeAllianceLeaderReply);
  rpc ChangeAllianceNotice (ChangeAllianceNoticeRequest) returns (ChangeAllianceNoticeReply);
  rpc AcceptGuildInvite (AcceptGuildInviteRequest) returns (AcceptGuildInviteReply);
  rpc LeaveGuild (LeaveGuildRequest) returns (LeaveGuildReply);
  rpc ExpelGuild (ExpelGuildRequest) returns (ExpelGuildReply);
  rpc ChangeGuildRankTitles (ChangeGuildRankTitlesRequest) returns (ChangeGuildRankTitlesReply);
  rpc ChangeGuildMemberRank (ChangeGuildMemberRankRequest) returns (ChangeGuildMemberRankReply);
  rpc ChangeGuildEmblem (ChangeGuildEmblemRequest) returns (ChangeGuildEmblemReply);
  rpc ChangeGuildNotice (ChangeGuildNoticeRequest) returns (ChangeGuildNoticeReply);
  rpc IncreaseGuildCapacity (IncreaseGuildCapacityRequest) returns (IncreaseGuildCapacityReply);
  rpc GainGuildGP (GainGuildGPRequest) returns (GainGuildGPReply);
  rpc SendGuildMessage (SendGuildMessageRequest) returns (SendGuildMessageReply);
  rpc GetGuildRanking (GetGuildRankingRequest) returns (GetGuildRankingReply);
  rpc ListGuildBulletinBoardThreads (ListGuildBulletinBoardThreadsRequest) returns (ListGuildBulletinBoardThreadsReply);
  rpc ShowGuildBulletinBoardThread (ShowGuildBulletinBoardThreadRequest) returns (ShowGuildBulletinBoardThreadReply);
  rpc CreateGuildBulletinBoardThread (CreateGuildBulletinBoardThreadRequest) returns (CreateGuildBulletinBoardThreadReply);
  rpc UpdateGuildBulletinBoardThread (UpdateGuildBulletinBoardThreadRequest) returns (UpdateGuildBulletinBoardThreadReply);
  rpc DeleteGuildBulletinBoardThread (DeleteGuildBulletinBoardThreadRequest) returns (DeleteGuildBulletinBoardThreadReply);
  rpc CreateGuildBulletinBoardReply (CreateGuildBulletinBoardReplyRequest) returns (CreateGuildBulletinBoardReplyReply);
  rpc DeleteGuildBulletinBoardReply (DeleteGuildBulletinBoardReplyRequest) returns (DeleteGuildBulletinBoardReplyReply);
  rpc DisbandGuild (DisbandGuildRequest) returns (DisbandGuildReply);
  rpc RequestBuddy (RequestBuddyRequest) returns (RequestBuddyReply);
  rpc AcceptBuddy (AcceptBuddyRequest) returns (AcceptBuddyReply);
  rpc RemoveBuddy (RemoveBuddyRequest) returns (RemoveBuddyReply);
  rpc BroadcastMultiChat (BroadcastMultiChatRequest) returns (BroadcastMultiChatReply);
  rpc SetServerDateTime (SetServerDateTimeRequest) returns (SetServerDateTimeReply);
  rpc BroadcastNotice (BroadcastNoticeRequest) returns (BroadcastNoticeReply);
  rpc WriteOperationLog (WriteOperationLogRequest) returns (WriteOperationLogReply);
  rpc FindCashShop (FindCashShopRequest) returns (FindCashShopReply);
  rpc EnterCashShop (EnterCashShopRequest) returns (EnterCashShopReply);
  rpc BuyCashItem (BuyCashItemRequest) returns (BuyCashItemReply);
  rpc TakeOutCashItem (TakeOutCashItemRequest) returns (TakeOutCashItemReply);
  rpc PutInCashItem (PutInCashItemRequest) returns (PutInCashItemReply);
  rpc SetCashWishlist (SetCashWishlistRequest) returns (SetCashWishlistReply);
  rpc AddCash (AddCashRequest) returns (AddCashReply);
  rpc ExpandCashSlot (ExpandCashSlotRequest) returns (ExpandCashSlotReply);
  rpc GiftCashItem (GiftCashItemRequest) returns (GiftCashItemReply);
  rpc BuyCashRing (BuyCashRingRequest) returns (BuyCashRingReply);
  rpc PayBackCashItem (PayBackCashItemRequest) returns (PayBackCashItemReply);
  rpc BuyCashQuestItem (BuyCashQuestItemRequest) returns (BuyCashQuestItemReply);
  rpc FindCashCoupon (FindCashCouponRequest) returns (FindCashCouponReply);
  rpc RedeemCashCoupon (RedeemCashCouponRequest) returns (RedeemCashCouponReply);
  rpc CreateCashCoupons (CreateCashCouponsRequest) returns (CreateCashCouponsReply);
  rpc CreateMarriage (CreateMarriageRequest) returns (MarriageReply);
  rpc LoadMarriage (LoadMarriageRequest) returns (MarriageReply);
  rpc GetMarriage (GetMarriageRequest) returns (MarriageReply);
  rpc BreakEngagement (BreakEngagementRequest) returns (MarriageReply);
  rpc ReserveWedding (ReserveWeddingRequest) returns (MarriageReply);
  rpc SetWeddingWishlist (SetWeddingWishlistRequest) returns (MarriageReply);
  rpc InviteWeddingGuest (InviteWeddingGuestRequest) returns (InviteWeddingGuestReply);
  rpc FinishWedding (FinishWeddingRequest) returns (MarriageReply);
  rpc RequestDivorce (RequestDivorceRequest) returns (MarriageReply);
  rpc CancelDivorce (CancelDivorceRequest) returns (MarriageReply);
  rpc GiveWeddingGift (GiveWeddingGiftRequest) returns (GiveWeddingGiftReply);
  rpc LoadWeddingGifts (LoadWeddingGiftsRequest) returns (LoadWeddingGiftsReply);
  rpc ClaimWeddingGift (ClaimWeddingGiftRequest) returns (ClaimWeddingGiftReply);
  rpc NotifySpouseMap (NotifySpouseMapRequest) returns (NotifySpouseMapReply);
}

enum ServerRole {
  SERVER_ROLE_UNSPECIFIED = 0;
  SERVER_ROLE_LOGIN = 1;
  SERVER_ROLE_GAME = 2;
  SERVER_ROLE_CASH_SHOP = 3;
}

message PingRequest {
  ServerRole role = 1;
  uint32 world_id = 2;
  uint32 channel_id = 3;
  string login_instance_id = 4;
  uint32 cash_shop_id = 5;
}

message FindCashShopRequest {
  uint32 world_id = 1;
}

message FindCashShopReply {
  bool found = 1;
  uint32 cash_shop_id = 2;
  string host = 3;
  uint32 port = 4;
}

message EnterCashShopRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
  uint32 cash_shop_id = 3;
  string client_ip = 4;
}

message CashItem {
  uint32 commodity_sn = 1;
  string buyer_name = 2;
  Inventory item = 3;
}

message EnterCashShopReply {
  EnterGameReply game = 1;
  uint32 return_channel_id = 2;
  uint32 nx_cash = 3;
  uint32 maple_point = 4;
  repeated CashItem locker = 5;
  repeated uint32 wishlist = 6;
  uint32 character_slot_count = 7;
  uint32 storage_slot_count = 8;
  repeated CashGift gifts = 9;
  repeated uint64 expired = 10;
}

message CashGift {
  uint64 serial = 1;
  uint32 item_id = 2;
  string sender_name = 3;
  string message = 4;
}

enum CashCurrency {
  CASH_CURRENCY_NX_CASH = 0;
  CASH_CURRENCY_MAPLE_POINT = 1;
}

enum CashShopResult {
  CASH_SHOP_RESULT_OK = 0;
  CASH_SHOP_RESULT_NOT_ENOUGH_CASH = 1;
  CASH_SHOP_RESULT_LOCKER_FULL = 2;
  CASH_SHOP_RESULT_NOT_FOUND = 3;
  CASH_SHOP_RESULT_SLOT_LIMIT = 4;
  CASH_SHOP_RESULT_SAME_ACCOUNT = 5;
  CASH_SHOP_RESULT_GENDER = 6;
  CASH_SHOP_RESULT_RECIPIENT_LOCKER_FULL = 7;
  CASH_SHOP_RESULT_COUPON_USED = 8;
  CASH_SHOP_RESULT_NOT_ENOUGH_MESO = 9;
}

message BuyCashItemRequest {
  uint32 world_id = 1;
  uint32 account_id = 2;
  CashCurrency currency = 3;
  uint32 price = 4;
  repeated CashItem items = 5;
}

enum CashSlotKind {
  CASH_SLOT_KIND_INVENTORY = 0;
  CASH_SLOT_KIND_STORAGE = 1;
  CASH_SLOT_KIND_CHARACTER = 2;
}

message ExpandCashSlotRequest {
  uint32 world_id = 1;
  uint32 account_id = 2;
  uint32 character_id = 3;
  CashSlotKind kind = 4;
  uint32 inventory_type = 5;
  CashCurrency currency = 6;
  uint32 price = 7;
  uint32 amount = 8;
  uint32 max = 9;
}

message ExpandCashSlotReply {
  CashShopResult result = 1;
  uint32 slots = 2;
  uint32 nx_cash = 3;
  uint32 maple_point = 4;
}

message GiftCashItemRequest {
  uint32 world_id = 1;
  uint32 account_id = 2;
  string recipient_name = 3;
  string message = 4;
  uint32 price = 5;
  uint32 gender = 6;
  repeated CashItem items = 7;
}

message GiftCashItemReply {
  CashShopResult result = 1;
  uint32 nx_cash = 2;
  uint32 maple_point = 3;
}

message BuyCashRingRequest {
  uint32 world_id = 1;
  uint32 account_id = 2;
  uint32 character_id = 3;
  string character_name = 4;
  uint32 gender = 5;
  bool couple = 6;
  string partner_name = 7;
  string message = 8;
  uint32 price = 9;
  CashItem item = 10;
  CashItem partner_item = 11;
}

message BuyCashRingReply {
  CashShopResult result = 1;
  uint32 nx_cash = 2;
  uint32 maple_point = 3;
}

message CashRing {
  uint64 serial = 1;
  uint64 partner_serial = 2;
  uint32 partner_id = 3;
  string partner_name = 4;
  uint32 item_id = 5;
}

message PayBackCashItemRequest {
  uint32 world_id = 1;
  uint32 account_id = 2;
  uint64 serial = 3;
  uint32 maple_point = 4;
}

message PayBackCashItemReply {
  CashShopResult result = 1;
  uint32 nx_cash = 2;
  uint32 maple_point = 3;
}

message BuyCashQuestItemRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
  uint32 price = 3;
  Inventory item = 4;
}

message BuyCashQuestItemReply {
  CashShopResult result = 1;
  int32 meso = 2;
}

enum CashCouponKind {
  CASH_COUPON_KIND_NX_CASH = 0;
  CASH_COUPON_KIND_MAPLE_POINT = 1;
  CASH_COUPON_KIND_ITEM = 2;
  CASH_COUPON_KIND_MESO = 3;
}

message FindCashCouponRequest {
  uint32 world_id = 1;
  string code = 2;
}

message FindCashCouponReply {
  CashShopResult result = 1;
  CashCouponKind kind = 2;
  uint32 value = 3;
}

message RedeemCashCouponRequest {
  uint32 world_id = 1;
  uint32 account_id = 2;
  uint32 character_id = 3;
  string code = 4;
  CashItem item = 5;
}

message RedeemCashCouponReply {
  CashShopResult result = 1;
  uint32 nx_cash = 2;
  uint32 maple_point = 3;
  int32 meso = 4;
}

message CreateCashCouponsRequest {
  uint32 world_id = 1;
  CashCouponKind kind = 2;
  uint32 value = 3;
  uint32 count = 4;
}

message CreateCashCouponsReply {
  repeated string codes = 1;
}

enum MarriageStatus {
  MARRIAGE_STATUS_NONE = 0;
  MARRIAGE_STATUS_ENGAGED = 1;
  MARRIAGE_STATUS_MARRIED = 3;
}

enum MarriageResult {
  MARRIAGE_RESULT_OK = 0;
  MARRIAGE_RESULT_NOT_FOUND = 1;
  MARRIAGE_RESULT_ALREADY_ENGAGED = 2;
  MARRIAGE_RESULT_PARTNER_ENGAGED = 3;
  MARRIAGE_RESULT_INVALID_STATE = 4;
  MARRIAGE_RESULT_GUEST_NOT_FOUND = 5;
  MARRIAGE_RESULT_GUEST_ALREADY_INVITED = 6;
  MARRIAGE_RESULT_GIFT_NOT_FOUND = 7;
}

message Marriage {
  uint32 marriage_id = 1;
  uint32 groom_id = 2;
  uint32 bride_id = 3;
  string groom_name = 4;
  string bride_name = 5;
  uint32 groom_item_id = 6;
  uint32 bride_item_id = 7;
  MarriageStatus status = 8;
  uint32 ticket_item_id = 9;
  bool groom_wished = 10;
  bool bride_wished = 11;
  repeated string groom_wishes = 12;
  repeated string bride_wishes = 13;
  repeated uint32 guests = 14;
  uint32 divorce_requester_id = 15;
  int64 divorce_requested_at_unix_ms = 16;
}

message MarriageReply {
  MarriageResult result = 1;
  optional Marriage marriage = 2;
}

message CreateMarriageRequest {
  uint32 world_id = 1;
  uint32 groom_id = 2;
  string groom_name = 3;
  uint32 bride_id = 4;
  string bride_name = 5;
  uint32 ring_item_id = 6;
}

message LoadMarriageRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
}

message GetMarriageRequest {
  uint32 world_id = 1;
  uint32 marriage_id = 2;
}

message BreakEngagementRequest {
  uint32 world_id = 1;
  uint32 marriage_id = 2;
  uint32 character_id = 3;
}

message ReserveWeddingRequest {
  uint32 world_id = 1;
  uint32 marriage_id = 2;
  uint32 ticket_item_id = 3;
}

message SetWeddingWishlistRequest {
  uint32 world_id = 1;
  uint32 marriage_id = 2;
  uint32 character_id = 3;
  repeated string wishes = 4;
}

message InviteWeddingGuestRequest {
  uint32 world_id = 1;
  uint32 marriage_id = 2;
  string guest_name = 3;
}

message InviteWeddingGuestReply {
  MarriageResult result = 1;
  uint32 guest_id = 2;
  string guest_name = 3;
}

message FinishWeddingRequest {
  uint32 world_id = 1;
  uint32 marriage_id = 2;
}

message RequestDivorceRequest {
  uint32 world_id = 1;
  uint32 marriage_id = 2;
  uint32 character_id = 3;
  uint64 now_unix_ms = 4;
}

message CancelDivorceRequest {
  uint32 world_id = 1;
  uint32 marriage_id = 2;
  uint32 character_id = 3;
}

message WeddingGift {
  uint32 gift_id = 1;
  string sender_name = 2;
  Inventory item = 3;
}

message GiveWeddingGiftRequest {
  uint32 world_id = 1;
  uint32 receiver_id = 2;
  WeddingGift gift = 3;
  CharacterSaveEntry sender = 4;
}

message GiveWeddingGiftReply {
  MarriageResult result = 1;
}

message LoadWeddingGiftsRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
}

message LoadWeddingGiftsReply {
  repeated WeddingGift gifts = 1;
}

message ClaimWeddingGiftRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
  uint32 gift_id = 3;
}

message ClaimWeddingGiftReply {
  MarriageResult result = 1;
  WeddingGift gift = 2;
}

message NotifySpouseMapRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
  uint32 spouse_id = 3;
  uint32 map_id = 4;
  bool reply = 5;
}

message NotifySpouseMapReply {
}

message BuyCashItemReply {
  CashShopResult result = 1;
  uint32 nx_cash = 2;
  uint32 maple_point = 3;
}

message TakeOutCashItemRequest {
  uint32 world_id = 1;
  uint32 account_id = 2;
  uint32 character_id = 3;
  Inventory item = 4;
}

message TakeOutCashItemReply {
  CashShopResult result = 1;
}

message PutInCashItemRequest {
  uint32 world_id = 1;
  uint32 account_id = 2;
  uint32 character_id = 3;
  CashItem item = 4;
}

message PutInCashItemReply {
  CashShopResult result = 1;
}

message SetCashWishlistRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
  repeated uint32 commodity_sns = 3;
}

message SetCashWishlistReply {
  bool ok = 1;
}

message AddCashRequest {
  uint32 world_id = 1;
  uint32 account_id = 2;
  int32 nx_cash = 3;
  int32 maple_point = 4;
}

message AddCashReply {
  uint32 nx_cash = 1;
  uint32 maple_point = 2;
}

message PingReply {
  string message = 1;
}

message GetGameChannelStatusRequest {
  uint32 world_id = 1;
  uint32 channel_id = 2;
}

message GetGameChannelStatusReply {
  bool alive = 1;
  bool channel_full = 2;
  bool found = 3;
  string host = 4;
  uint32 port = 5;
}

message GetServerCatalogRequest {}

message ChannelCatalog {
  uint32 channel_id = 1;
  string host = 2;
  uint32 port = 3;
  string name = 4;
}

message WorldCatalog {
  uint32 world_id = 1;
  string world_name = 2;
  uint32 flag = 3;
  string event_message = 4;
  repeated ChannelCatalog channels = 5;
}

message GetServerCatalogReply {
  repeated WorldCatalog worlds = 1;
}

message EnterGameRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
  uint32 channel_id = 3;
  string client_ip = 4;
}

message Character {
  uint32 character_id = 1;
  uint32 world_id = 2;
  string name = 3;
  uint32 gender = 4;
  uint32 skin_color = 5;
  uint32 face = 6;
  uint32 hair = 7;
  uint32 level = 8;
  uint32 class_id = 9;
  uint32 str = 10;
  uint32 dex = 11;
  uint32 int_stat = 12;
  uint32 luk = 13;
  uint32 hp = 14;
  uint32 max_hp = 15;
  uint32 mp = 16;
  uint32 max_mp = 17;
  uint32 ability_point = 18;
  uint32 exp = 19;
  uint32 map_id = 20;
  uint32 spawn_point = 21;
  int32 position_x = 22;
  int32 position_y = 23;
  uint32 stance = 24;
  int32 meso = 25;
  uint32 skill_point = 26;
  uint32 account_id = 27;
  uint32 role = 28;
  bool hidden = 29;
  uint32 population = 30;
  uint32 hp_ap_used = 31;
  uint32 pet_hp_item = 32;
  uint32 pet_mp_item = 33;
  uint64 summoned_pet = 34;
  repeated uint32 slot_limits = 35;
  uint32 monster_book_cover = 36;
  repeated uint32 teleport_stones = 37;
  repeated uint32 vip_teleport_stones = 38;
  int64 saved_at_unix_ms = 39;
}

message MonsterBookCard {
  uint32 card_id = 1;
  uint32 count = 2;
}

message KeyLayoutBinding {
  int32 slot = 1;
  uint32 type = 2;
  int32 action = 3;
}

message EnterGameReply {
  bool found = 1;
  Character character = 2;
  repeated Inventory inventory = 3;
  repeated Skill skills = 4;
  repeated KeyLayoutBinding key_layout = 5;
  optional uint32 party_id = 6;
  optional uint32 guild_id = 7;
  repeated Buff buffs = 8;
  repeated BuddyEntry buddies = 9;
  uint32 buddy_capacity = 10;
  repeated Quest quests = 11;
  repeated SavedLocation saved_locations = 12;
  repeated Debuff debuffs = 13;
  optional Marriage marriage = 14;
  repeated uint32 cash_wishlist = 15;
  repeated CashRing rings = 16;
  repeated MonsterBookCard monster_book = 17;
  repeated Record records = 18;
  repeated Record account_records = 19;
}

message Debuff {
  uint32 mask = 1;
  int32 position = 2;
  int32 x = 3;
  uint32 skill_id = 4;
  uint32 skill_level = 5;
  int64 end_unix_ms = 6;
}

message BeginGameTransitionRequest {
  uint32 world_id = 1;
  uint32 account_id = 2;
  uint32 character_id = 3;
  string client_ip = 4;
  repeated Debuff debuffs = 5;
  optional uint32 source_channel_id = 6;
  optional uint32 source_cash_shop_id = 7;
}

enum SessionErrorCode {
  SESSION_NONE = 0;
  SESSION_UNKNOWN = 1;
  SESSION_ALREADY_LOGGED_IN = 2;
  SESSION_NOT_FOUND = 3;
  SESSION_LOGOUT_FAILED = 4;
  SESSION_CLIENT_IP_MISMATCH = 5;
  SESSION_NOT_OWNER = 6;
}

message BeginGameTransitionReply {
  bool ok = 1;
  SessionErrorCode error_code = 2;
}

message SaveCharacterRequest {
  Character character = 1;
  map<int32, uint32> base_looks = 2;
  map<int32, uint32> overlays = 3;
}

message SaveCharacterReply {
  bool ok = 1;
}

message CharacterSaveEntry {
  Character character = 1;
  map<int32, uint32> base_looks = 2;
  map<int32, uint32> overlays = 3;
  repeated Inventory inventory = 4;
  repeated Skill skills = 5;
  repeated KeyLayoutBinding key_layout = 6;
  repeated Buff buffs = 7;
  repeated Quest quests = 8;
  repeated SavedLocation saved_locations = 9;
  Storage storage = 10;
  repeated MonsterBookCard monster_book = 11;
  repeated Record records = 12;
  repeated Record account_records = 13;
}

message Storage {
  uint32 account_id = 1;
  uint32 world_id = 2;
  uint32 slots = 3;
  int32 meso = 4;
  repeated Inventory items = 5;
}

message LoadStorageRequest {
  uint32 account_id = 1;
  uint32 world_id = 2;
}

message LoadStorageReply {
  Storage storage = 1;
}

enum ParcelResult {
  PARCEL_RESULT_OK = 0;
  PARCEL_RESULT_RECIPIENT_NOT_FOUND = 1;
  PARCEL_RESULT_SAME_ACCOUNT = 2;
  PARCEL_RESULT_RECIPIENT_FULL = 3;
  PARCEL_RESULT_ONE_OF_A_KIND = 4;
  PARCEL_RESULT_NOT_FOUND = 5;
  PARCEL_RESULT_NOT_ARRIVED = 6;
}

message Parcel {
  uint32 parcel_id = 1;
  uint32 receiver_id = 2;
  string sender_name = 3;
  int32 meso = 4;
  bool quick = 5;
  string message = 6;
  int64 sent_at_unix_ms = 7;
  Inventory item = 8;
}

message LoadParcelsRequest {
  uint32 world_id = 1;
  uint32 character_id = 2;
}

message LoadParcelsReply {
  repeated Parcel parcels = 1;
  repeated Parcel expired = 2;
}

message SendParcelRequest {
  uint32 world_id = 1;
  string recipient_name = 2;
  Parcel parcel = 3;
  uint32 sender_account_id = 4;
  CharacterSaveEntry sender = 5;
  bool one_of_a_kind = 6;
}

message SendParcelReply {
  ParcelResult result = 1;
}

message ClaimParcelRequest {
  uint32 world_id = 1;
